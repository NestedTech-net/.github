version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/hcapture-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/hcapture-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    directory: "/hcapture-solver"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    directory: "/hcapture-perception"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

