name: HCapture Nightly Reliability

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  nightly-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcapture-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hcapture-tests/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:integration
      - run: npm run test:load

