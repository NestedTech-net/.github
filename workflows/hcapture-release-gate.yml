name: HCapture Release Gate

on:
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            hcapture-backend/package-lock.json
            hcapture-tests/package-lock.json

      - name: Backend release checks
        working-directory: hcapture-backend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run security:audit

      - name: Tests release checks
        working-directory: hcapture-tests
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration

